<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio E-commerce Card</title>
    <link rel="stylesheet" href="ecommerce.css">
</head>
<body>
    <div class="product-card">

        <span class="badge-discount">-20% OFF</span>
        
        <img class="product-img" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="tenis esportivo">
        
        <div class="product-info">
            <span class="category">Calçados</span>
            <h3 class="product-title">Tênis Running Pro</h3>
            
            <div class="price-box">
                <span class="old-price">R$ 299,90</span>
                <span class="current-price">R$ 239,90</span>
            </div>
            <button class="btn-buy">Comprar Agora</button>
        </div>
    </div>
</body>
</html>
