<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela HTML Simples</title>
</head>
<body>
    
    <h2>Boletim de Notas (Apenas html)</h2>

    <table border="1">
        <!-- caption: O título/legenda da tabela  -->
        <caption>nota do primeiro bimeste - Turma A</caption>
        
        <!-- thead: Cabeçalho da tabela -->
        <thead>
            <!-- tr: table Rom (Linha da tabela) -->
            <tr>
                <!-- th: Table Header (célula de cabeçalho) -->
                <th>Aluno</th>
                <th>Matemática</th>
                <th>História</th>
                <th>Ciência</th>
            </tr>
        </thead>
        <!-- tbody: Corpo da tabela (onde ficam os dados principais) -->
        <tbody>
            <tr>
                <!-- td: Table Data -->
                <td>Bruna medeiros</td>
                <td>8.5</td>
                <td>9.0</td>
                <td>7.5</td>
            </tr>
            <tr>
                <td>Roberto</td>
                <td>6.0</td>
                <td>7.5</td>
                <td>8.0</td>
            </tr>
            <tr>
                <td>Lorrane Gimenez</td>
                <td>9.5</td>
                <td>8.5</td>
                <td>9.5</td>
            </tr>
        </tbody>

        <!-- tfoot: RodaPé da tabela (Geralmente usado para totais ou médias) -->
         <tfoot>
            <tr>
                <th>Média da turma</th>
                <th>8.0</th>
                <th>8.3</th>
                <th>8.3</th>
            </tr>
         </tfoot>
    </table>

</body>
</html>
