<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tabelas de Contas</title>
</head>
<body>
    <table class="tabela-estilizada">
        <thead>
            <tr>
                <th>ID Pedido</th>
                <th>Cliente</th>
                <th>Status</th>
                <th>Valor</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>#1001</td>
                <td>Sofia Oliveira</td>
                <td ><span class="status-pago">Pago</span></td>
                <td>R$ 250,00</td>
            </tr>
            <tr>
                <td>#1002</td>
                <td>Miguel Toilette</td>
                <td ><span class="status-pendente">Pendente</span></td>
                <td>R$ 120,50</td>
            </tr>
            <tr>
                <td>#1003</td>
                <td>Bruna Medeiros</td>
                <td><span class="status-pago">Pago</span></td>
                <td>R$ 450,00</td>
            </tr>
            <tr>
                <td>#1004</td>
                <td>Mairon Men</td>
                <td><span class="status-cancelado">Cancelado</span></td>
                <td>R$ 89,90</td>
            </tr>
        </tbody>
        <tfoot>
            <th colspan="3">Total Acumulado</th>
            <th>R$ 910,40</th>
        </tfoot>
    </table>
</body>
</html>
